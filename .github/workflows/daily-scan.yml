name: Advanced three-hour quant scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Session-open notifications and one-hour follow-up scans. Both UTC hour
    # possibilities are listed to accommodate Europe/US daylight-saving changes.
    # Tokyo: local 09:00 JST = 00:00 UTC; follow-up at 01:00 UTC.
    - cron: "5 0,1 * * 0-4"
    # Frankfurt/London: 07:00 UTC during summer time, 08:00 UTC during winter.
    # 09:00 UTC also catches the one-hour follow-up after the winter open.
    - cron: "5 7,8,9 * * 1-5"
    # New York open / start of the London-Frankfurt-New York overlap.
    # DST changes mean the relevant UTC hour varies across the year.
    - cron: "5 12,13,14,15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: advanced-quant-scan
  cancel-in-progress: false

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      # Pushes and pull requests run tests only; avoid unintended notifications.
      - name: Run scan
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'nii-gold-forex-bot' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '1000' }}
          ACCOUNT_CURRENCY: ${{ vars.ACCOUNT_CURRENCY || 'USD' }}
          SESSION_START_UTC: "00:00"
          SESSION_END_UTC: "00:00"
          ENFORCE_SESSION: "false"
          FORCE_MARKET_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RISK_PER_TRADE: "0.0025"
          DAILY_LOSS_LIMIT: "0.01"
          MAX_SIMULTANEOUS_SIGNALS: "2"
          MIN_CONFIDENCE: "0.64"
        run: python bot.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: advanced-quant-report-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
