name: Advanced three-hour quant scan

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekdays, 12:00 UTC = 12:00 Ghana time. Session is 12:00-15:00 UTC.
    - cron: "0 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: advanced-quant-scan
  cancel-in-progress: false

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      # Pushes run tests only; avoid misleading out-of-session push notifications.
      - name: Run scan
        if: github.event_name != 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'nii-gold-forex-bot' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '1000' }}
          ACCOUNT_CURRENCY: ${{ vars.ACCOUNT_CURRENCY || 'USD' }}
          SESSION_START_UTC: "12:00"
          SESSION_END_UTC: "15:00"
          ENFORCE_SESSION: "true"
          RISK_PER_TRADE: "0.0025"
          DAILY_LOSS_LIMIT: "0.01"
          MAX_SIMULTANEOUS_SIGNALS: "2"
          MIN_CONFIDENCE: "0.64"
        run: python bot.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-quant-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
