name: Advanced quant frequent scan

on:
  schedule:
    # Hourly monitoring scans at :20 UTC every day, excluding existing session-alert UTC hours
    # (00, 01, 07, 08, 09, 12, 13, 14, 15) to avoid colliding with those alerts.
    # The core bot's signal horizon remains 3 hours; this workflow does not change that logic.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-quant-frequent-scan
  cancel-in-progress: false

jobs:
  frequent-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run on-demand market scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'nii-gold-forex-bot' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '1000' }}
          ACCOUNT_CURRENCY: ${{ vars.ACCOUNT_CURRENCY || 'USD' }}
          SESSION_START_UTC: "00:00"
          SESSION_END_UTC: "00:00"
          ENFORCE_SESSION: "false"
          FORCE_MARKET_SCAN: "true"
          RISK_PER_TRADE: "0.0025"
          DAILY_LOSS_LIMIT: "0.01"
          MAX_SIMULTANEOUS_SIGNALS: "2"
          MIN_CONFIDENCE: "0.64"
        run: python bot.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: advanced-quant-frequent-report-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
